[package]
name = "endless_dream"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = "0.34"
rodio = { version = "0.19", features = ["symphonia-all"] }
lofty = "0.18"
walkdir = "2.5"
rfd = "0.14"
image = { version = "0.24", features = ["png", "jpeg"] }
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6.0"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"